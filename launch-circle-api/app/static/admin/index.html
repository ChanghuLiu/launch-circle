<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Launch Circle · 管理后台</title><link rel="stylesheet" href="/admin/assets/admin.css"><script src="/admin/assets/admin.js" defer></script></head><body>
<header><div class="brand">LC <span>Launch Circle <small>管理后台</small></span></div><div id="session" hidden><button id="refresh" type="button">刷新数据</button><button id="logout" type="button" class="quiet">退出</button></div></header>
<main><section id="login" class="login panel" hidden><span class="eyebrow">OPERATOR ACCESS</span><h1>管理你的测试项目</h1><p>客户、安装进度和测试安排，集中查看。</p><form id="login-form"><label>管理员密码<input id="password" type="password" required maxlength="256" autocomplete="current-password"></label><button type="submit">登录后台</button></form><small>仅授权管理员可访问。登录保持 8 小时。</small></section>
<div id="message" role="status" aria-live="polite"></div><section id="workspace" hidden><div class="intro"><div><span class="eyebrow">TEST OPERATIONS</span><h1>测试运营总览</h1><p id="updated"></p></div><label class="search">搜索客户或 App<input id="search" type="search" placeholder="名称 / 邮箱 / 包名"></label></div><div id="stats" class="stats"></div><p class="notice">安装与加入状态来自用户确认；测试活动来自任务和反馈记录。后台不能确认 Google 连续 14 天资格。自有产品与模拟项目分别统计。</p><nav aria-label="管理页面" id="tabs"><button data-tab="apps" aria-current="page">App 进度</button><button data-tab="customers">客户</button><button data-tab="testers">测试人员</button><button data-tab="tasks">安装与测试</button><button data-tab="dispatch">人工调度</button><button data-tab="intakes">接入申请</button><button data-tab="audit">操作记录</button></nav><section id="content" aria-live="polite"></section></section></main><footer>Technologies RegEvidence inc. · Launch Circle</footer></body></html>
