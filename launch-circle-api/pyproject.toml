[project]
name = "launch-circle-api"
version = "0.1.0"
description = "Backend API for 12 Testers - Launch Circle"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.43,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
