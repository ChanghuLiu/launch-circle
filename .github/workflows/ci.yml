name: Launch Circle CI

"on":
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'launch-circle-api/**'
      - 'launch-circle-android/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'launch-circle-api/**'
      - 'launch-circle-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-circle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: launch-circle-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: launch-circle-api/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint evidence modules (existing phase0 debt excluded)
        run: >-
          python -m ruff check
          app/api/evidence.py app/models/evidence.py app/models/__init__.py
          app/api/pool.py app/models/pool.py app/services/matching.py tests/test_shared_pool.py
          app/api/intake.py app/services/intake.py tests/test_app_intake.py scripts/review_app_intake.py
          alembic/versions/0017_assisted_app_intake.py
          alembic/versions/0016_shared_tester_pool.py
          app/schemas/evidence.py app/main.py app/core/config.py
          alembic/versions/0015_cold_start_evidence.py
          scripts/seed_evidence_pilot.py scripts/seed_evidence_ui_fixture.py
          scripts/submit_device_evidence.py scripts/export_evidence_report.py
          tests/test_evidence.py tests/test_evidence_adapter.py tests/test_evidence_capacity.py
      - name: Run backend suite
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Verify empty SQLite migration upgrade
        env:
          APP_ENV: development
          SQLITE_DATABASE_URL: sqlite:///./ci-migration.db
        run: python -m alembic upgrade head
      - name: Preserve backend test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-python-${{ matrix.python }}-reports
          path: launch-circle-api/reports/
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android tests, debug build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: launch-circle-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            launch-circle-android/**/*.gradle.kts
            launch-circle-android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Run Android checks without release credentials
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          -PlaunchCircleEvidencePilotBuild=true
          -PlaunchCircleApiBaseUrl=http://127.0.0.1:8786/
      - name: Preserve Android test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            launch-circle-android/app/build/test-results/testDebugUnitTest/
            launch-circle-android/app/build/reports/tests/testDebugUnitTest/
            launch-circle-android/app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: ignore
